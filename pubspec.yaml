name: shipway
description: Local-first CI/CD for Flutter. Sets up flavors, generates fastlane lanes, and ships to TestFlight, the App Store, Google Play and Firebase from your own machine.
version: 0.1.0-beta.2
repository: https://github.com/shihabkandil/shipway
issue_tracker: https://github.com/shihabkandil/shipway/issues
topics:
  - flutter
  - cli
  - fastlane
  - deployment
  - ci

environment:
  sdk: ^3.8.0

executables:
  shipway: shipway

# Fake keys that exist to prove shipway refuses a secret pasted into a config.
false_secrets:
  - /test/fixtures/config/invalid/secret_in_ref.yaml
  - /test/unit/config/secret_ref_validator_test.dart

dependencies:
  args: ^2.7.0
  checked_yaml: ^2.0.4
  cli_completion: ^0.6.0
  collection: ^1.19.1
  crypto: ^3.0.7
  json_annotation: ^4.12.0
  json_schema: ^5.2.2
  mason_logger: ^0.3.5
  meta: ^1.19.0
  path: ^1.9.1
  pub_updater: ^0.6.0
  pubspec_parse: ^1.6.0
  xml: ^6.5.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  build_runner: ^2.4.13
  json_serializable: ^6.14.1
  lints: ^5.1.1
  mocktail: ^1.0.5
  test: ^1.32.0
